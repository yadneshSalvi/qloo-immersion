services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: immersion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: immersion
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - immersion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immersion -d immersion']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  immersion_pgdata:
